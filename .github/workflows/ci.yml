name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up JDK 26
      uses: actions/setup-java@v5
      with:
        java-version: "26"
        distribution: "oracle"
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: "9.7.0"
    - name: Build with Gradle
      run: gradle build
